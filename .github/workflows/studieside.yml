name: Studieside

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "studieside/**"
      - ".github/workflows/studieside.yml"
  pull_request:
    paths:
      - "studieside/**"
      - ".github/workflows/studieside.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check and build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studieside/package-lock.json
      - name: Install
        working-directory: studieside
        run: npm ci --no-audit --no-fund
      - name: Check
        working-directory: studieside
        run: npm run check
      - name: Build
        working-directory: studieside
        run: npm run build
