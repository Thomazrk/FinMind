name: Kontrolpanel

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "kontrolpanel/**"
      - ".github/workflows/kontrolpanel.yml"
  pull_request:
    paths:
      - "kontrolpanel/**"
      - ".github/workflows/kontrolpanel.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, test and build the panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kontrolpanel/web/package-lock.json
      - name: Install
        working-directory: kontrolpanel/web
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: kontrolpanel/web
        run: npm run lint
      - name: Test
        working-directory: kontrolpanel/web
        run: npm test
      - name: Build
        working-directory: kontrolpanel/web
        run: npm run build
      - name: Build demo
        working-directory: kontrolpanel/web
        run: npm run build:demo

  seed:
    name: Check the seed data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate seed JSON
        working-directory: kontrolpanel/seed
        run: node --check seed.mjs && node -e "JSON.parse(require('fs').readFileSync('data.json','utf8'))"
